<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verificador Pedidos VW</title>
<style>
body{font-family:system-ui;background:#f0f2f5;padding:10px}
.box{background:#fff;padding:18px;border-radius:16px;max-width:800px;margin:auto;box-shadow:0 4px 14px #0001}
.drop{border:2px dashed #0a84ff;border-radius:12px;padding:24px;text-align:center;font-weight:800;color:#0a84ff;background:#f5f9ff;margin-top:12px}
.row{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:14px;border-radius:10px;border:0;font-weight:800}
.btn-dark{background:#111;color:#fff}
.btn-green{background:#18a957;color:#fff}
.btn-blue{background:#0a84ff;color:#fff;width:100%;margin-top:10px;padding:14px;border-radius:10px;border:0;font-weight:800}
</style>
</head>
<body>
<div class="box">
<input id="pedido" placeholder="Nro Pedido" style="width:100%;padding:14px;border-radius:10px;border:1px solid #ccc;box-sizing:border-box">
<div class="drop" id="drop">Subir PDF o Imagen</div>
<button class="btn-blue" id="btnVerificar">Verificar</button>
<div class="row">
<button class="btn btn-dark" id="btnListado">Copiar Todo (listado)</button>
<button class="btn btn-green" id="btnExcel">Copiar Todo Excel (columna)</button>
</div>
<pre id="out" style="background:#fafafa;border:1px solid #eee;border-radius:10px;padding:10px;margin-top:12px;white-space:pre-wrap">Acá aparece el resultado</pre>
</div>
<script>
// Pega acá tu lógica de verificación real si la tenés, esto es solo para que veas los botones
document.getElementById('drop').onclick=()=>alert('Acá va tu subida de PDF');
document.getElementById('btnListado').onclick=()=>{navigator.clipboard.writeText(document.getElementById('out').innerText); alert('Copiado listado');}
document.getElementById('btnExcel').onclick=()=>{navigator.clipboard.writeText(document.getElementById('out').innerText); alert('Copiado para Excel');}
</script>
</body>
</html>
